name: Snyk Dependency Scan

on: 
  pull_request:
    types: ["opened"]
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: bm24
        run: npm install

      - name: Install llm-service dependencies
        working-directory: bm24/llm-service
        run: npm install

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk test
        working-directory: bm24
        run: snyk test --all-projects --sarif-file-output=snyk-dependency.sarif
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_TOKEN }}

      # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bm24/snyk-dependency.sarif

      # Push the Snyk Code results as Artifact
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snyk-dependency-sarif
          path: bm24/snyk-dependency.sarif
