name: Snyk Sast Scan

on: [push]

permissions:
  security-events: write
  contents: read

jobs:
    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Snyk
              run: npm install -g snyk

            - name: Run Snyk SAST
              working-directory: bm24
              run: snyk code test --all-projects --sarif-file-output=snyk-code.sarif
              continue-on-error: true
              env:
                  SNYK_TOKEN:
                      ${{ secrets.SNYK_API_TOKEN }}

            # Push the Snyk Code results into GitHub Code Scanning tab
            - name: Upload results
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: bm24/snyk-code.sarif

            # Push the Snyk Code results as Artifact
            - name: Upload results as artifact
              uses: actions/upload-artifact@v4
              with:
                name: snyk-code-sarif
                path: bm24/snyk-code.sarif
