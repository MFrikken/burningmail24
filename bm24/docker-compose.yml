services:
  bm24:
    build: .
    container_name: bm24
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    networks:
      - bm24-internal

  llm-service:
    build: ./llm-service
    container_name: llm-service
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./llm-service/model_cache:/home/llm/.cache/huggingface:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    networks:
      - bm24-internal

networks:
  bm24-internal:
    driver: bridge
    internal: true