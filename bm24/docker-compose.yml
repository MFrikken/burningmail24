services:
  bm24:
    build: .
    container_name: bm24
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - bm24-internal

  llm-service:
    build: ./llm-service
    container_name: llm-service
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./model_cache:/home/llm/.cache/huggingface:ro
    networks:
      - bm24-internal

  caddy: 
    image: caddy:2
    container_name: caddy
    cap_drop:
      - SETPCAP
      - MKNOD
      - AUDIT_WRITE
      - CHOWN
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - bm24-internal

networks:
  public:
    driver: bridge
  bm24-internal:
    driver: bridge
    internal: true

volumes: 
  hf_cache: 
  caddy_data:
  caddy_config:
