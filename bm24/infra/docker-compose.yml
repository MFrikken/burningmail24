services:
  bm24-frontend:
    build: ../next-frontend
    container_name: bm24-frontend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    networks:
      - bm24-internal

  llm-service:
    build: ../services/llm-service
    container_name: llm-service
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../services/llm-service/model_cache:/app/model_cache:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    networks:
      - bm24-internal

networks:
  bm24-internal:
    driver: bridge
    external: true
    # create the local network before starting the containers:
    # docker network create --driver bridge --internal bm24-internal